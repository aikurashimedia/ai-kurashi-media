name: Verify AI connection
on:
  push:
    paths: ['.github/workflows/verify-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate four images with Gemini without publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import bot;from pathlib import Path;from datetime import datetime;from zoneinfo import ZoneInfo;day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat();post=bot.generate(day,{});bot.render(post,Path('public')/day);print('AI generation and four-image verification succeeded')"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-generated-carousel
          path: public/
          retention-days: 3
