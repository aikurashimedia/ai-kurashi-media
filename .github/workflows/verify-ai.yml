name: Verify AI connection
on:
  push:
    paths: ['.github/workflows/verify-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate four images with Gemini without publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: 'false'
        run: |
          python -c "import json,pathlib;p=pathlib.Path('config.json');c=json.loads(p.read_text());c['enabled']=True;p.write_text(json.dumps(c))"
          python bot.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ai-generated-carousel
          path: public/
          retention-days: 3
